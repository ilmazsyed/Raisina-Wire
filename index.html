<body>
  <div id="app">
    <p style="font:500 13px system-ui;color:#596173;text-align:center;margin-top:40vh">Loading Raisina Wire…</p>
  </div>
  <style>
    /* Page text the server includes for search engines and slow connections; the app replaces it. */
    .ssr{max-width:760px;margin:0 auto;padding:28px 18px 60px;font:17px/1.7 Newsreader,Georgia,serif;color:#0f1422;background:#f8f8fa}
    .ssr header{border-bottom:3px solid #0f1422;padding-bottom:12px;margin-bottom:24px}
    .ssr-brand{font:900 40px/1 "Noto Serif Display",Georgia,serif;font-stretch:66%;color:#0f1422;text-decoration:none}.ssr-brand span{color:#b8141f}
    .ssr-nav{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font:600 14px Manrope,system-ui,sans-serif}.ssr-nav a{color:#3b414d;text-decoration:none}
    .ssr h1{font:500 38px/1.12 Newsreader,Georgia,serif;letter-spacing:-.5px;margin:10px 0}.ssr img{max-width:100%;height:auto;border-radius:14px}
    .ssr-kicker,.ssr-byline,.ssr small{font:500 12px "DM Mono",monospace;letter-spacing:1px;text-transform:uppercase;color:#596173}.ssr-kicker{color:#b8141f}
    .ssr-dek{font-size:21px;color:#3b414d}.ssr-list{padding-left:18px}.ssr-list li{margin:14px 0}.ssr a{color:#0f1422}
  </style>
  <script type="module" src="/src/main.js"></script>
