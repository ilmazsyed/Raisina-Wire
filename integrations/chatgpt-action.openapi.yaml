openapi: 3.1.0
info:
  title: Raisina Wire Publisher
  version: 1.0.0
  description: >
    Authenticated editorial publishing API for Raisina Wire. Create drafts first.
    Publishing, going live, and sending reader alerts require the editor's explicit
    approval in the conversation.
servers:
  - url: https://raisinawire.calibrex.org
security:
  - PublisherBearer: []
components:
  securitySchemes:
    PublisherBearer:
      type: http
      scheme: bearer
      bearerFormat: PUBLISH_TOKEN
  schemas:
    Article:
      type: object
      required: [title, body]
      properties:
        kind:
          type: string
          enum: [article, edition]
          default: article
        title: { type: string, minLength: 8, maxLength: 180 }
        dek: { type: string, maxLength: 400 }
        topic: { type: string, maxLength: 80, description: "Region · Theme kicker" }
        category:
          type: string
          enum: [Geopolitics, Security, India, Diplomacy, Markets, Energy, Analysis]
        tags:
          type: array
          items: { type: string }
        writer: { type: string, description: "Writer key; normally ilmaz-syed or raisina-wire." }
        body: { type: string, maxLength: 100000 }
        sourceUrl: { type: string, format: uri }
        imageUrl: { type: string }
        heroUrl: { type: string }
        heroCaption: { type: string, maxLength: 300 }
        videoUrl: { type: string }
        status:
          type: string
          enum: [draft, published]
          default: draft
        publishedAt: { type: string, format: date-time }
        notify:
          type: boolean
          default: false
          description: "Keep false unless the editor explicitly approves a reader alert."
    LiveCoverage:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 5, maxLength: 180 }
        summary: { type: string, maxLength: 500 }
        slug: { type: string }
        status:
          type: string
          enum: [draft, live]
          default: draft
        imageUrl: { type: string }
        socialUrl: { type: string }
        heroCaption: { type: string, maxLength: 300 }
        notify: { type: boolean, default: false }
    LiveUpdate:
      type: object
      required: [body]
      properties:
        body: { type: string, maxLength: 12000 }
        sourceUrl: { type: string }
        mediaUrl: { type: string }
        notify: { type: boolean, default: false }
    Media:
      type: object
      required: [title, mediaUrl]
      properties:
        title: { type: string, minLength: 3, maxLength: 180 }
        mediaUrl: { type: string }
        mediaType:
          type: string
          enum: [video, short, image, gallery, audio, embed]
          default: video
        category: { type: string }
        thumbnailUrl: { type: string }
        description: { type: string, maxLength: 2000 }
        fullId: { type: string }
        status:
          type: string
          enum: [draft, published]
          default: draft
    Event:
      type: object
      required: [title, startsAt]
      properties:
        title: { type: string, minLength: 5, maxLength: 180 }
        description: { type: string, maxLength: 3000 }
        eventType: { type: string, default: Briefing }
        startsAt: { type: string, format: date-time, description: "ISO 8601 with India offset, e.g. 2026-11-10T18:00:00+05:30" }
        access:
          type: string
          enum: [public, member, premium]
          default: public
    Alert:
      type: object
      required: [title, url]
      properties:
        title: { type: string, minLength: 3 }
        body: { type: string }
        url: { type: string, description: "A site-relative path such as /live or /article/story-slug" }
paths:
  /api/health:
    get:
      operationId: publisherHealth
      security: []
      summary: Check Raisina Wire API health
      responses:
        '200':
          description: API health
  /api/admin/stats:
    get:
      operationId: publisherAuthCheck
      summary: Verify publisher credentials and editor access
      responses:
        '200': { description: Authenticated publisher }
        '403': { description: Publisher credentials rejected }
  /api/admin/articles:
    get:
      operationId: listArticles
      summary: List newsroom articles and editions
      responses:
        '200': { description: Articles and writer keys }
    post:
      operationId: createArticle
      summary: Create an article or edition; draft by default
      description: Set status to published only after explicit editor approval. notify defaults to false.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Article' }
      responses:
        '201': { description: Created article; returns id and slug }
        '400': { description: Validation error }
  /api/admin/articles/{id}:
    put:
      operationId: updateArticle
      summary: Update, publish, unpublish, or archive an existing article
      description: Use status published only after explicit editor approval. notify must remain false unless separately approved.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Article' }
      responses:
        '200': { description: Article updated }
        '404': { description: Article not found }
  /api/admin/live:
    get:
      operationId: listLiveCoverage
      summary: List live coverage
      responses:
        '200': { description: Live coverage list }
    post:
      operationId: createLiveCoverage
      summary: Create live coverage; draft by default
      description: Going live and reader alerts require explicit editor approval.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LiveCoverage' }
      responses:
        '201': { description: Coverage created; returns id and slug }
  /api/admin/live/{id}:
    put:
      operationId: updateLiveCoverage
      summary: Change live coverage status or its editorial metadata
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [live, ended, draft] }
                title: { type: string }
                summary: { type: string }
                imageUrl: { type: string }
                socialUrl: { type: string }
                heroCaption: { type: string }
                results: { type: object }
                notify: { type: boolean, default: false }
      responses:
        '200': { description: Coverage updated }
  /api/admin/live/{id}/updates:
    post:
      operationId: postLiveUpdate
      summary: Add a live coverage update
      description: notify must remain false unless the editor explicitly approves a push alert.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LiveUpdate' }
      responses:
        '201': { description: Update posted }
  /api/admin/media:
    get:
      operationId: listMedia
      summary: List multimedia items
      responses:
        '200': { description: Media items }
    post:
      operationId: createMedia
      summary: Create a multimedia item; draft by default
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Media' }
      responses:
        '201': { description: Media item created }
  /api/admin/events:
    get:
      operationId: listEvents
      summary: List editorial events and briefings
      responses:
        '200': { description: Events }
  /api/events:
    post:
      operationId: createEvent
      summary: Create a published event or briefing
      description: This endpoint publishes immediately. Call only after explicit editor approval.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Event' }
      responses:
        '201': { description: Event created }
  /api/admin/events/{id}:
    put:
      operationId: updateEventStatus
      summary: Change event status
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [published, cancelled, draft] }
      responses:
        '200': { description: Event status updated }
  /api/admin/alerts:
    get:
      operationId: listAlerts
      summary: List recent reader alerts
      responses:
        '200': { description: Alerts and subscriber count }
    post:
      operationId: sendMajorAlert
      summary: Send a major alert to readers
      description: Sends to readers. MUST only be called after the editor explicitly approves the exact alert headline, body, and destination.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Alert' }
      responses:
        '201': { description: Alert queued or sent }
