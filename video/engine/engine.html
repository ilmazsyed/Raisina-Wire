<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<title>Raisina Wire video engine</title>
<link rel="stylesheet" href="fonts.css">
<style>
  html, body { margin: 0; background: #0f1422; }
  canvas { display: block; }
  /* Preview mode (open with ?preview): fit the frame to the window, scrub with the slider. */
  body.preview { display: grid; place-items: center; min-height: 100vh; gap: 12px; color: #fff; font: 14px Manrope, sans-serif; }
  body.preview canvas { max-width: 96vw; max-height: 84vh; width: auto; height: auto; box-shadow: 0 10px 40px #0008; }
  body.preview input { width: min(900px, 90vw); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="engine.js"></script>
<script>
  // Preview: engine.html?preview&spec=../out/<slug>/spec.json&format=16x9 plays the film with its audio.
  const q = new URLSearchParams(location.search);
  if (q.has('preview')) (async () => {
    document.body.className = 'preview';
    const base = q.get('spec').replace(/spec\.json$/, '');
    const spec = await fetch(q.get('spec')).then(r => r.json()), timing = await fetch(base + 'timing.json').then(r => r.json());
    const [w, h] = q.get('format') === '9x16' ? [1080, 1920] : [1920, 1080];
    await RW.load(spec, timing, w, h, document.getElementById('c'));
    const audio = new Audio(base + 'audio.m4a'), bar = Object.assign(document.createElement('input'), { type: 'range', min: 0, max: timing.total, step: .01, value: 0 });
    document.body.append(bar); bar.oninput = () => { audio.currentTime = +bar.value; };
    document.getElementById('c').onclick = () => audio.paused ? audio.play() : audio.pause();
    (function tick() { RW.draw(audio.currentTime); bar.value = audio.currentTime; requestAnimationFrame(tick); })();
  })();
</script>
</body>
</html>
