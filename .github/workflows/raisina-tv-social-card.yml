name: Build Raisina TV social card

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/seo.js"
      - "tools/og/build.mjs"
      - "tools/og/shoot.cjs"
      - "anchors/**"
      - "public/anchors/**"

permissions:
  contents: write

concurrency:
  group: raisina-tv-social-card
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install image tooling
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
          python -m pip install pillow
      - name: Capture site screens and build social artwork
        run: |
          node tools/og/cap.cjs
          node tools/og/build.mjs
          node tools/og/shoot.cjs
      - name: Commit Raisina TV share image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/og-tv.jpg
          if git diff --cached --quiet; then
            echo "No social image changes."
          else
            git commit -m "Add Raisina TV social share artwork"
            git push
          fi
