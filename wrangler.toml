# Rashtrix 24×7 News: its own Worker and its own D1 database, never Raisina Wire's.
name = "rashtrix"
main = "src/worker.js"
compatibility_date = "2026-10-16"
# The headless browser library for the share cards needs Node's APIs.
compatibility_flags = ["nodejs_compat"]

# Cloudflare Browser Rendering (free tier): photographs each story's share card (src/ogcard.js).
[browser]
binding = "BROWSER"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# The Worker renders public pages (titles, social cards, schema.org data, story text for
# search engines), uploaded images, sitemaps, robots.txt and the RSS feed. Everything else
# is served straight from the built files. Bengali pages are at the bare addresses; English
# under /en, Hindi under /hi; old /bn addresses redirect.
run_worker_first = [
  "/api/*", "/mcp", "/oauth/*", "/.well-known/*", "/media/*", "/clips/*", "/", "/edition/*", "/article/*", "/author/*", "/tag/*", "/desk/*",
  "/og/*", "/live", "/briefs", "/community", "/discussion/*", "/events", "/coverage/*",
  "/about", "/terms", "/privacy", "/disclaimer", "/copyright", "/corrections", "/community-guidelines", "/grievance", "/privacy.html", "/terms.html",
  "/en", "/en/*", "/hi", "/hi/*", "/bn", "/bn/*",
  "/sitemap.xml", "/news-sitemap.xml", "/robots.txt", "/feed.xml", "/rss.xml"
]

# Every minute: alerts for scheduled stories, pushes, the wire desk (sources → rewrites and
# briefs) and the Wix import.
[triggers]
crons = ["* * * * *"]

# The rashtrix-db database (created with `npx wrangler d1 create rashtrix-db`).
# Tables are created automatically on first use (migrations/).
[[d1_databases]]
binding = "DB"
database_name = "rashtrix-db"
database_id = "bb54e3c7-eb77-46db-8863-5a1f3e27f303"
migrations_dir = "migrations"

[vars]
APP_NAME = "Rashtrix 24×7 News"
# Built-in admin account. Its password is the ADMIN_PASSWORD secret, set in the Cloudflare
# dashboard (Worker → Settings → Variables and Secrets), never here.
ADMIN_EMAIL = "ilmazsyed@gmail.com"
# The app's public address, used in canonical links, sitemaps, the RSS feed and social cards.
# Page visits to the workers.dev address are redirected here. Leave empty until the domain is
# connected (the workers.dev address is used meanwhile).
SITE_URL = "https://rashtrix.live"
# Rashtrix's Wix blog, imported and kept in sync (src/wix.js).
# The Wix blog to import from (its own address, e.g. https://name.wixsite.com/site). Empty = the
# import is off: rashtrix.live is now this app, no longer the Wix site.
WIX_SITE = ""
# The wire desk (src/wiredesk.js): needs the GEMINI_API_KEY secret (Google AI Studio, free tier).
# Models in order of choice. The free tier counts each model separately: Flash-Lite about 500
# requests a day each, Flash 20. When one is used up for the day the desk moves to the next.
GEMINI_MODELS = "gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-3.8-flash"
# Calls a day across all the models, spread evenly round the clock.
GEMINI_DAILY_LIMIT = "1000"
# "Listen" voices (Google Cloud Text-to-Speech, Chirp 3 HD; needs GOOGLE_TTS_API_KEY).
# Defaults: bn-IN-Chirp3-HD-Sulafat (female) and bn-IN-Chirp3-HD-Charon (male); override with
# TTS_VOICE_BN_FEMALE, TTS_VOICE_BN_MALE, TTS_VOICE_EN_FEMALE … here.

# Rashtrix TV (src/youtube.js): needs the YOUTUBE_API_KEY secret (YouTube Data API v3, free quota).
# Units a day the TV may use refreshing sources (the free quota is 10,000).
YOUTUBE_DAILY_UNITS = "8000"
# The control room: rundowns and the as-run log are kept this many days; clips this many days unused.
ARCHIVE_DAYS = "90"
CLIP_RETENTION_DAYS = "30"
# Rashtrix Command Centre (self-hosted NRCS): its address and the app's account there (the
# password is the NRCS_PASSWORD secret). Empty = the producer's import is off.
NRCS_URL = ""
NRCS_USERNAME = ""

[ai]
binding = "AI"

# Realtime control (src/control.js): one Durable Object per channel and per live-studio room.
# SQLite-backed, so it runs on the Workers free plan.
[[durable_objects.bindings]]
name = "CONTROL"
class_name = "TvControl"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TvControl"]

# Video clips (src/clips.js) in Cloudflare R2 (free tier: 10 GB). Switched off until the bucket
# exists (a deploy fails if it names a bucket that does not): enable R2 in the dashboard, run
# `npx wrangler r2 bucket create rashtrix-clips`, then remove the # from the three lines below.
# Clips not marked "keep" are deleted after CLIP_RETENTION_DAYS without use.
# [[r2_buckets]]
# binding = "CLIPS"
# bucket_name = "rashtrix-clips"
