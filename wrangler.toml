name = "raisina-wire"
main = "src/worker.js"
compatibility_date = "2026-10-16"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# D1 is optional: without it the site, news and markets work and account/admin
# routes answer 503. To enable it, create the database, paste its real id below
# and uncomment the block. A placeholder id makes `wrangler deploy` fail.
# [[d1_databases]]
# binding = "DB"
# database_name = "raisina-wire-db"
# database_id = "<your D1 database id>"
# migrations_dir = "migrations"

[vars]
APP_NAME = "Raisina Wire"

# Market pulse uses keyless public feeds; no market-data secret is required.
