name = "raisina-wire"
main = "src/worker.js"
compatibility_date = "2026-10-16"

# Build the site before every upload (deploys, preview builds, wrangler dev), so ./dist always exists.
[build]
command = "npm run build"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# The Worker renders public pages (titles, social cards, schema.org data, story text for
# search engines), uploaded images, sitemaps, robots.txt and the RSS feed. Everything else
# is served straight from the built files.
run_worker_first = [
  "/api/*", "/media/*", "/", "/editions", "/edition/*", "/article/*", "/author/*", "/tag/*",
  "/live", "/live/*", "/markets", "/community", "/discussion/*", "/events", "/coverage/*", "/watch",
  "/about", "/terms", "/privacy", "/disclaimer", "/copyright", "/community-guidelines", "/grievance", "/privacy.html", "/terms.html",
  "/sitemap.xml", "/news-sitemap.xml", "/robots.txt", "/feed.xml", "/rss.xml"
]

# Every minute: send alerts for scheduled stories that have gone live, and the next batch
# of breaking-news pushes.
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "raisina-wire-db"
database_id = "edf1ed45-d413-404e-bd96-a15707bbdec3"
migrations_dir = "migrations"

[vars]
APP_NAME = "Raisina Wire"
# Built-in admin account. Its password is the ADMIN_PASSWORD secret, set in the
# Cloudflare dashboard (Worker → Settings → Variables and Secrets), never here.
ADMIN_EMAIL = "ilmazsyed@gmail.com"
# The site's public address, used in canonical links, sitemaps, the RSS feed and social
# cards. Page visits to the workers.dev address are redirected here.
SITE_URL = "https://raisinawire.calibrex.org"
# "Listen" voice: a natural Indian English woman's voice from Google Cloud Text-to-Speech.
# Needs the GOOGLE_TTS_API_KEY secret (see README). Other female en-IN voices: Aoede, Kore,
# Leda, Achernar, Vindemiatrix, Despina (en-IN-Chirp3-HD-<name>).
TTS_VOICE = "en-IN-Chirp3-HD-Sulafat"
# Publishers who asked not to be excerpted (comma-separated domains): headline, summary and link only.
PUBLISHER_OPT_OUT = ""

# Market pulse uses keyless public feeds; no market-data secret is required.
